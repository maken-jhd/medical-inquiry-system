search_impl: modular_v2

search_policy:
  root_action_mode: mcts

search:
  discriminative_gain_weight: 0.12

transition_model:
  type: statistical
  statistics_source_mode: auto
  statistics_top_k_hypotheses: 3
  enable_belief_mixture: true
  fallback_to_heuristic: true
  statistics_smoothing_alpha: 0.5
  statistics_min_total_count: 3
  hybrid_enable_count_aware_mixing: true
  hybrid_count_threshold_low: 3
  hybrid_count_threshold_mid: 8
  hybrid_count_threshold_high: 20
  hybrid_lambda_low: 0.25
  hybrid_lambda_mid: 0.5
  hybrid_lambda_high: 0.8
  backoff_discount_disease_family_question_type: 1.0
  backoff_discount_disease_question_type: 0.85
  backoff_discount_family_question_type: 0.65
  backoff_discount_question_type: 0.4
  backoff_discount_global: 0.15

reward_model:
  type: belief_aware_v1
  enable_top3_separation_gain: true
  enable_competitor_elimination_bonus: true
  enable_discriminative_support_bonus: true
  top3_separation_weight: 0.24
  competitor_elimination_weight: 0.26
  discriminative_support_weight: 0.18
  acceptance_risk_weight: 0.16
  detail_non_discriminative_penalty: 0.05

acceptance_calibration:
  enable_reward_confidence_proxy: true
  min_belief_margin_proxy: 0.12
  max_acceptance_risk_proxy: 0.22
  min_branch_support_quality: 0.42
  margin_relaxation_buffer: 0.025
  risk_relaxation_buffer: 0.045
  high_support_quality_override: 0.62
  high_support_quality_risk_discount: 0.05

path_evaluation:
  enable_discriminative_answer_bonus: true
  discriminative_answer_bonus_weight: 0.08
  competitor_suppression_bonus_weight: 0.07
  rank_stability_bonus_weight: 0.05
  discriminative_support_bonus_weight: 0.05
