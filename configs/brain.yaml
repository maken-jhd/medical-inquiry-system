llm:
  structured_retry_count: 2

# 当前默认仍保留 legacy MCTS，便于 benchmark / replay 做回归对照；
# 如需启用新的可插拔骨架，可切到 modular_v2。
search_impl: legacy

search:
  num_rollouts: 8
  max_depth: 6
  max_child_nodes: 4
  exploration_weight: 2.0
  discount_factor: 1.0
  max_kg_triplets: 15

search_policy:
  # 当前这轮 benchmark 先切到 No-Tree Greedy：
  # 直接跳过 select/expand/rollout/backprop，只按当前候选态动作先验选下一问。
  root_action_mode: mcts

rollout_control:
  # 当前默认配置切到 batch2 + P4 + P5 + P7。
  # 也就是保留多分支 rollout / 防塌缩、动态权重、单答案封顶，
  # 并重新打开 scope-aware rerank 与 final score scope penalty。
  # `branch_selection_mode` 目前支持：
  # - greedy：沿用 weighted_reward 贪心选分支
  # - sampled：按概率做确定性采样占位
  # - expectation_ready：先按高概率分支保守推进，为后续 chance node 留接口
  enable_multi_branch_rollout: true
  branch_budget_per_action: 2
  enable_anti_collapse_penalty: true
  branch_selection_mode: greedy

# 回答转移模型负责输出 rollout 中 future answer 的条件概率分布。
transition_model:
  type: heuristic
  statistics_source_mode: auto
  statistics_top_k_hypotheses: 3
  enable_belief_mixture: true
  fallback_to_heuristic: true
  statistics_smoothing_alpha: 0.5
  statistics_min_total_count: 1
  # 默认留空时，statistical 模式会自动发现最新的 graph cases / replay / evidence catalog。
  graph_case_paths: []
  replay_result_paths: []
  evidence_catalog_paths: []

# reward model 负责把信息增益近似、成本和不确定性拆成可替换的组件。
reward_model:
  type: heuristic_v2
  enable_belief_margin_gain: true
  enable_uncertainty_reduction: true
  enable_acceptance_risk_penalty: true
  belief_top_k_hypotheses: 3
  margin_gain_weight: 0.32
  uncertainty_reduction_weight: 0.28
  acceptance_risk_weight: 0.22
  branch_likelihood_floor: 0.05
  min_branch_support_count: 3.0
  low_value_high_cost_penalty_multiplier: 1.15

# acceptance calibration 只做 verifier 之后的轻量 proxy guard，
# 不改 verifier / repair 的整体职责边界。
acceptance_calibration:
  enable_reward_confidence_proxy: true
  min_belief_margin_proxy: 0.12
  max_acceptance_risk_proxy: 0.22
  min_branch_support_quality: 0.42

# belief signature 负责决定搜索树何时可复用、child state 如何近似表示。
state_signature:
  include_exam_context: true
  include_top_hypotheses: true
  include_asked_node_ids: true
  include_active_topics: true
  include_pending_context: true
  max_top_hypotheses: 3

kg:
  entity_link_threshold: 0.72
  top_k_entity_matches: 5
  disable_kg_below_threshold: true

path_evaluation:
  consistency_weight: 0.3
  diversity_weight: 0.4
  agent_eval_weight: 0.3
  agent_eval_mode: llm_verifier
  llm_verifier_min_turn_index: 2
  llm_verifier_min_trajectory_count: 2
  observed_final_accept_threshold: 0.72
  observed_final_scope_mismatch_block_threshold: 0.28
  enable_dynamic_group_weights: true
  enable_single_answer_group_cap: true
  low_anchor_single_group_score_cap: 0.62
  enable_scope_penalty_in_final_score: true

a1:
  use_llm_extractor: true

a2:
  expand_top_k_hypotheses: 3
  scope_sibling_limit: 12
  enable_scope_cluster_rerank: true
  scope_cluster_exact_bonus: 0.35
  scope_cluster_generic_penalty: 0.28

a3:
  use_discriminative_gain: true
  validation_limit: 10
  enable_early_exam_context_rescue: true
  early_exam_context_turn_limit: 2
  early_exam_context_revealed_count_threshold: 2
  exam_context_rescue_high_cost_role_threshold: 0.45

candidate_feedback:
  enable_multi_hypothesis_feedback: true
  use_scope_weighted_feedback: true
  max_related_hypotheses_per_evidence: 5

repair:
  enable_verifier_hypothesis_reshuffle: true
  # 为了暴露 search root 本身的价值，这轮先临时关闭 repair action 接管。
  enable_best_repair_action: false
  enable_tree_reroot: true
  protect_repair_action_from_low_cost_explorer: true
  # 同时限制 low-cost explorer 抢走 search root，避免 no-tree root policy 还没落地就被覆盖。
  protect_search_root_action_from_low_cost_explorer: true
  allow_low_cost_explorer_after_repair_if_unaskable_only: true
  enable_missing_key_support_competition_escalation: true
  missing_key_support_retry_threshold: 2
  zero_anchor_current_answer_force_competition: true

fallback:
  enable_question_selector_mode: true
  max_fail_count: 2
